<style>

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, sans-serif, "Noto Sans Telugu", "Nirmala UI";

    color: var(--text);

    transition: background 0.2s, color 0.2s;

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg); color: var(--header-text);
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;

  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .back { font-size: 13px; color: var(--header-text); background: none; border: none; display: none; }
  #darkToggle {

  /* Chapter list view */
  #chapterListView { padding: 16px; }
  .ch-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;

  .ch-title { font-size: 15px; font-weight: 600; }
  .ch-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .ch-status {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
    white-space: nowrap;
  }
  .status-notstarted { background: #EDEBE3; color: #8A877D; }
  .status-inprogress { background: #FCEBD5; color: #B8701C; }
  .status-done { background: #DDF0DD; color: #2E6B1F; }
  html.dark .status-notstarted { background: #2A2C31; color: #9A9A94; }
  html.dark .status-inprogress { background: #4A3419; color: #E8A756; }
  html.dark .status-done { background: #1D3A1D; color: #6FCB6F; }

  #reviewView { display: none; padding: 12px 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 12px; overflow: hidden; position: relative;
  }
  .card.marked { background: #FBEAE9; border-color: #E8B4B0; }
  html.dark .card.marked { background: #3A2020; border-color: #6B3A3A; }
  .card.marked .q-text { text-decoration: line-through; opacity: 0.55; }
  .q-row {
    padding: 16px 46px 16px 16px; cursor: pointer;
    display: flex; align-items: flex-start; gap: 10px; user-select: none;
  }
  .q-num { color: #B8341C; font-weight: 700; font-size: 15px; min-width: 26px; }
  html.dark .q-num { color: #E06B52; }
  .q-text { font-size: 16px; line-height: 1.5; flex: 1; }
  .chev { position: absolute; right: 14px; top: 16px; font-size: 13px; color: var(--muted); transition: transform 0.2s; }
  .card.open .chev { transform: rotate(180deg); }
  .answer { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; background: var(--answer-bg); }
  .card.open .answer { border-top: 1px solid var(--border); }
  .answer-inner { padding: 14px 16px; }
  .tag-box {
    background: #E4F1DC; color: #2E6B1F; font-weight: 700; font-size: 16px;
    border-radius: 10px; padding: 14px 16px;
  }
  html.dark .tag-box { background: #1D3A1D; color: #8FDB8F; }
  .extra-text { font-size: 14px; color: var(--extra-text); padding: 12px 0 4px; line-height: 1.6; }

  #actionbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--header-bg);
    padding: 12px 16px; display: flex; gap: 10px; align-items: center;

  #actionbar button { border: none; border-radius: 10px; padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #undoBtn { background: #3A3A36; color: #F7F6F2; }
  #completeBtn { background: #2E6B1F; color: #fff; }

  #reviewBottomBar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--header-bg);
    padding: 12px 16px; display: flex; gap: 10px;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.15);

  #markDoneBtn { background: #2E6B1F; color: #fff; }

  }

    width: 100%; background: #B8341C; color: #fff; border: none; border-radius: 10px;
    padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer;

</style>

let chapters = JSON.parse(JSON.stringify(MERGED_DATA.chapters));
chapters.forEach(ch => {
  ch._status = 'notstarted'; // notstarted | inprogress | done
  ch.faqs.forEach(f => f._marked = false);
});

const STORAGE_KEY = 'faqProofread_' + (MERGED_DATA.subject || 'default');

function saveProgress() {
  const progress = chapters.map(ch => ({
    slug: ch.slug,
    status: ch._status,
    marked: ch.faqs.map(f => f._marked)
  }));
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) { /* storage full or unavailable, ignore */ }
}

function loadProgress() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    const progress = JSON.parse(saved);
    progress.forEach(p => {
      const ch = chapters.find(c => c.slug === p.slug);
      if (!ch) return;
      ch._status = p.status;
      p.marked.forEach((m, i) => {
        if (ch.faqs[i]) ch.faqs[i]._marked = m;
      });
    });
  } catch (e) { /* corrupted/unavailable, ignore */ }
}

loadProgress();

let currentChapterIdx = null;
let openCard = null;
let openAnswer = null;
let history = [];

const darkToggle = document.getElementById('darkToggle');
function applyDarkMode(isDark) {
  document.documentElement.classList.toggle('dark', isDark);
  darkToggle.textContent = isDark ? '☀️' : '🌙';
  try { localStorage.setItem('faqProofread_darkMode', isDark ? '1' : '0'); } catch (e) {}
}
darkToggle.addEventListener('click', () => {
  applyDarkMode(!document.documentElement.classList.contains('dark'));
});
(function initDarkMode() {
  let saved = null;
  try { saved = localStorage.getItem('faqProofread_darkMode'); } catch (e) {}
  if (saved === '1') applyDarkMode(true);
  else if (saved === '0') applyDarkMode(false);
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) applyDarkMode(true);
})();

const chapterListView = document.getElementById('chapterListView');
const reviewView = document.getElementById('reviewView');
const questionList = document.getElementById('questionList');
const headerTitle = document.getElementById('headerTitle');
const backBtn = document.getElementById('backBtn');
const resetBtn = document.getElementById('resetBtn');
resetBtn.addEventListener('click', () => {
  if (!confirm('Reset all progress for this file? This clears all marks and chapter statuses.')) return;
  localStorage.removeItem(STORAGE_KEY);
  chapters.forEach(ch => {
    ch._status = 'notstarted';
    ch.faqs.forEach(f => f._marked = false);
  });
  renderChapterList();
});
const reviewBottomBar = document.getElementById('reviewBottomBar');
const markDoneBtn = document.getElementById('markDoneBtn');
const allDoneBar = document.getElementById('allDoneBar');
const sendAllBtn = document.getElementById('sendAllBtn');

function renderChapterList() {
  reviewView.style.display = 'none';
  reviewBottomBar.style.display = 'none';
  chapterListView.style.display = 'block';
  backBtn.style.display = 'none';
  resetBtn.style.display = chapters.length > 0 ? 'block' : 'none';
  headerTitle.textContent = MERGED_DATA.subject !== 'PASTE_SUBJECT_NAME_HERE'
    ? MERGED_DATA.subject : 'FAQ Proofreader';

  if (chapters.length === 0) {
    chapterListView.innerHTML = `<div style="padding:40px 16px; text-align:center; color:#8A877D; font-size:14px;">
      No merged JSON loaded yet.<br>Paste your JSON into the MERGED_DATA variable in this file.
    </div>`;
    return;
  }

  chapterListView.innerHTML = chapters.map((ch, idx) => {
    const markedCount = ch.faqs.filter(f => f._marked).length;
    const statusLabel = ch._status === 'done' ? 'Done'
      : ch._status === 'inprogress' ? 'In Progress' : 'Not Started';
    return `<div class="ch-card" data-idx="${idx}">
      <div>
        <div class="ch-title">Ch.${ch.chapterNumber} — ${ch.title || ch.slug}</div>
        <div class="ch-sub">${ch.faqs.length} questions${markedCount ? ' · ' + markedCount + ' marked for delete' : ''}</div>
      </div>
      <span class="ch-status status-${ch._status}">${statusLabel}</span>
    </div>`;
  }).join('');

  chapterListView.querySelectorAll('.ch-card').forEach(card => {
    card.addEventListener('click', () => openChapter(parseInt(card.dataset.idx)));
  });

  updateAllDoneBar();
}

function openChapter(idx) {
  currentChapterIdx = idx;
  const ch = chapters[idx];
  if (ch._status === 'notstarted') { ch._status = 'inprogress'; saveProgress(); }

  chapterListView.style.display = 'none';
  reviewView.style.display = 'block';
  reviewBottomBar.style.display = 'flex';
  backBtn.style.display = 'block';
  resetBtn.style.display = 'none';
  headerTitle.textContent = `Ch.${ch.chapterNumber} — ${ch.title || ch.slug}`;
  openCard = null; openAnswer = null; history = [];

  renderQuestions(ch);
}

function renderQuestions(ch) {
  questionList.innerHTML = '';
  ch.faqs.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card' + (item._marked ? ' marked' : '');
    card.dataset.idx = idx;

    const qRow = document.createElement('div');
    qRow.className = 'q-row';
    qRow.innerHTML = `<span class="q-num">${idx + 1}.</span><span class="q-text">${escapeHtml(item.q)}</span><span class="chev">▾</span>`;
    card.appendChild(qRow);

    const tagHtml = item.a ? `<div class="tag-box">${escapeHtml(item.a)}</div>` : '';
    const extraHtml = item.e ? `<div class="extra-text">${escapeHtml(item.e)}</div>` : '';
    const answer = document.createElement('div');
    answer.className = 'answer';
    answer.innerHTML = `<div class="answer-inner">${tagHtml}${extraHtml}</div>`;
    card.appendChild(answer);

    let pressTimer = null;
    let longPressed = false;
    let touchHandled = false;
    let touchStartX = 0, touchStartY = 0;
    let touchMoved = false;

    const startPress = (e) => {
      longPressed = false;
      touchMoved = false;
      if (e && e.touches && e.touches[0]) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
      pressTimer = setTimeout(() => {
        longPressed = true;
        toggleMark(ch, item, card);
        if (navigator.vibrate) navigator.vibrate(40);
      }, 500);
    };
    const cancelPress = () => clearTimeout(pressTimer);

    qRow.addEventListener('touchstart', startPress, {passive: true});
    qRow.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches[0]) {
        const dx = Math.abs(e.touches[0].clientX - touchStartX);
        const dy = Math.abs(e.touches[0].clientY - touchStartY);
        if (dx > 10 || dy > 10) touchMoved = true;
      }
      cancelPress();
    });
    qRow.addEventListener('touchend', (e) => {
      cancelPress();
      touchHandled = true;
      if (!longPressed && !touchMoved) {
        e.preventDefault();
        toggleOpen(card, answer);
      }
      setTimeout(() => { touchHandled = false; }, 500);
    });
    qRow.addEventListener('mousedown', (e) => {
      if (touchHandled) return;
      startPress();
    });
    qRow.addEventListener('mouseup', (e) => {
      if (touchHandled) return;
      cancelPress();
      if (!longPressed) toggleOpen(card, answer);
    });
    qRow.addEventListener('mouseleave', cancelPress);

    questionList.appendChild(card);
  });
}

function toggleOpen(card, answerEl) {
  const isOpen = card.classList.contains('open');
  if (openCard && openCard !== card) {
    openCard.classList.remove('open');
    openAnswer.style.maxHeight = null;
  }
  if (isOpen) {
    card.classList.remove('open'); answerEl.style.maxHeight = null;
    openCard = null; openAnswer = null;
  } else {
    card.classList.add('open'); answerEl.style.maxHeight = answerEl.scrollHeight + 'px';
    openCard = card; openAnswer = answerEl;
  }
}

function toggleMark(ch, item, card) {
  item._marked = !item._marked;
  card.classList.toggle('marked', item._marked);
  saveProgress();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

backBtn.addEventListener('click', renderChapterList);

markDoneBtn.addEventListener('click', async () => {
  const ch = chapters[currentChapterIdx];
  ch._status = 'done';
  saveProgress();
  const cleaned = buildCleanedChapter(ch);
  await shareFile(`corrected-${ch.slug || 'chapter-' + ch.chapterNumber}.json`, cleaned);
  renderChapterList();
});

function updateAllDoneBar() {
  const allDone = chapters.length > 0 && chapters.every(c => c._status === 'done');
  allDoneBar.style.display = allDone ? 'block' : 'none';
}

function buildCleanedChapter(ch) {
  return {
    slug: ch.slug,
    chapterNumber: ch.chapterNumber,
    title: ch.title,
    faqs: ch.faqs.filter(f => !f._marked).map(f => ({ q: f.q, a: f.a, e: f.e }))
  };
}

/* WhatsApp number to open after download (with country code, no +, no spaces) */
const WHATSAPP_NUMBER = '918919489236';

function shareFile(filename, jsonObj) {
  const text = JSON.stringify(jsonObj, null, 2);

  // Step 1: download the file. No auto-redirect after this — on mobile, opening
  // a new tab right after triggering a download interrupts the save, so instead
  // we wait for the user to confirm the file has saved before opening WhatsApp.
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  // Step 2: show a confirmation prompt. User taps it only after the download
  // has actually completed, then WhatsApp opens with a reminder to attach the file.
  // (No browser/OS allows a webpage to auto-attach a file into WhatsApp directly.)
  showWhatsAppPrompt(filename);
}

function showWhatsAppPrompt(filename) {
  const existing = document.getElementById('waPromptOverlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'waPromptOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:flex-end;';
  overlay.innerHTML = `
    <div style="background:var(--panel);color:var(--text);width:100%;padding:20px 16px 24px;border-radius:16px 16px 0 0;">
      <div style="font-size:15px;font-weight:600;margin-bottom:6px;">File downloaded</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">"${filename}" saved to your device. Tap below to open WhatsApp, then attach the file from your Downloads.</div>
      <div style="display:flex;gap:10px;">
        <button id="waCancelBtn" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px;font-weight:600;">Close</button>
        <button id="waOpenBtn" style="flex:2;padding:12px;border-radius:10px;border:none;background:#2E6B1F;color:#fff;font-size:14px;font-weight:700;">Open WhatsApp</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('waCancelBtn').addEventListener('click', () => overlay.remove());
  document.getElementById('waOpenBtn').addEventListener('click', () => {
    const msg = encodeURIComponent(`Sending "${filename}". Please attach it here (check your Downloads folder).`);
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
    overlay.remove();
  });
}

sendAllBtn.addEventListener('click', async () => {
  const cleaned = chapters.map(buildCleanedChapter);
  const output = { subject: MERGED_DATA.subject, chapters: cleaned };
  await shareFile(`corrected-${MERGED_DATA.subject || 'faq'}.json`, output);
});

renderChapterList();
</script>
